[package]
name = "holotable-wasm"
description = "holotable-core's line of sight, compiled to WebAssembly for the browser."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# A `cdylib` is a library meant to be loaded by something that isn't Rust: here,
# the browser's WebAssembly engine. `rlib` lets `cargo test` link it natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
holotable-core = { path = "../core" }
serde_json.workspace = true
# Pinned exactly: the `wasm-bindgen` command-line tool that generates the
# JavaScript glue must be the very same version (see scripts/build-wasm.sh).
wasm-bindgen = "=0.2.130"

[lints.rust]
# The code `#[wasm_bindgen]` generates uses `unsafe` internally to pass values
# across the boundary. Our own code here has none.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
