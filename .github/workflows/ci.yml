name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml installs stable, rustfmt, clippy and the wasm32 target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript types are up to date
        run: git diff --exit-code -- client/src/protocol/generated
      - name: Vision code builds for WebAssembly
        run: cargo build -p holotable-wasm --target wasm32-unknown-unknown

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # `npm run typecheck` and `npm run build` first build crates/wasm to
      # WebAssembly (scripts/build-wasm.sh), which needs Rust and wasm-bindgen.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
